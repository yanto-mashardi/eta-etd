<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIMA2 Next</title><style>body{font:15px system-ui;background:#f2f5f8;color:#183047;margin:0}header{background:#14334c;color:white;padding:24px}main{max-width:1150px;margin:auto;padding:20px}section{background:white;border:1px solid #d9e3eb;border-radius:8px;padding:18px;margin-bottom:16px;overflow:auto}h1,h2{margin:0 0 12px}h2{font-size:18px}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #e2e8ef}small{color:#637387}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}pre{white-space:pre-wrap}</style><header><h1>BIMA2 · Real-time Ferry Operations</h1>Staging — Bengkalis / Pakning</header><main><div class="grid"><section><h2>AIS</h2><div id="ais">—</div></section><section><h2>Model aktif</h2><pre id="model">—</pre></section><section><h2>Prediksi ETA–ETD</h2><div id="prediction">—</div><small>Prediksi belum diterbitkan sebelum adapter event tervalidasi.</small></section></div><section><h2>Kapal</h2><table><thead><tr><th>Kapal / MMSI</th><th>Posisi</th><th>SOG</th><th>Terminal terdekat</th><th>Waktu AIS</th></tr></thead><tbody id="ships"></tbody></table></section><div class="grid"><section><h2>Bengkalis — kendaraan</h2><pre id="bengkalis">—</pre></section><section><h2>Pakning — kendaraan</h2><pre id="pakning">—</pre></section></div><small id="updated"></small></main><script>const put=(id,v)=>document.getElementById(id).textContent=v;async function poll(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();put('ais',s.ais_status+' / '+(s.ais_file_age_seconds==null?'—':Math.round(s.ais_file_age_seconds)+' s'));put('model',JSON.stringify(s.models,null,2));put('prediction',s.prediction_status);const body=document.getElementById('ships');body.replaceChildren();for(const v of s.vessels){const tr=document.createElement('tr');for(const x of [v.shipname||v.mmsi,[v.latitude,v.longitude].join(', '),v.sog,v.nearest_terminal,v.timestamp]){const td=document.createElement('td');td.textContent=x??'—';tr.append(td)}body.append(tr)}for(const p of ['bengkalis','pakning'])put(p,s.vehicles[p]?JSON.stringify(s.vehicles[p],null,2):'Menunggu data CCTV');put('updated','Refresh '+new Date().toLocaleString('id-ID'));}catch(e){put('updated','Koneksi gagal — data terakhir mungkin kedaluwarsa')}finally{setTimeout(poll,5000)}}poll()</script></html>
